<style>
    body {
        text-align: center;
    }

    input {
        display: block;
        margin: 10px auto;
    }

    button {
        margin: 10px;
    }

    div {
        margin: 10px auto;
    }
</style>


<label for="nome">Nome:</label>
<input type="text" id="nome" name="nome" placeholder="Digite seu nome aqui...">

<label for="senha1">senha:</label>
<input type="text" id="senha1" senha="senha1" placeholder="Digite sua senha aqui...">

<label for="senha2">confirme sua senha:</label>
<input type="text" id="senha2" senha2="senha2" placeholder="Digite confirme sua senha aqui...">


<button onclick="enviar()">Enviar</button>
<div id="resultado">Seu Nome:</div>
<div id="resultado2">Sua Senha:</div>

<script type="text/javascript">
	
function enviar()
{
	    let nome = document.getElementById("nome").value;
	    let senha1 = document.getElementById("senha1").value;
	       let senha2 = document.getElementById("senha2").value;
         


document.getElementById("resultado").innerText = "Seu Nome:" +nome

if (senha1===senha2)
{
document.getElementById("resultado2").innerText = "Sua Senha:" +senha1

  document.getElementById("nome").style.display = "none";
           document.getElementById("senha2").style.display = "none";
           document.getElementById("senha1").style.display = "none";
           document.querySelector("button").style.display = "none";
         document.querySelectorAll("label").forEach(function(label) {
        label.style.display = "none";
    });
}
else
{
document.getElementById("resultado2").innerText = "Suas senhas não estão iguais"

}

}



</script>
